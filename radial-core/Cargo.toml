[package]
name = "radial-core"
version = "0.1.0"
edition = "2024"
authors = ["Devin Ward <devissquared@gmail.com>"]
description = "Task orchestration library for LLM agents with contract-based coordination"
readme = "../README.md"
license = "MIT"
repository = "https://github.com/devsquared/radial"
homepage = "https://github.com/devsquared/radial"
documentation = "https://docs.rs/radial-core"
keywords = ["tasks", "agents", "llm", "orchestration"]
categories = ["development-tools"]

[dependencies]
fs2 = "0.4"
nanoid = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
anyhow = "1.0"
jiff = { version = "0.2", features = ["serde"] }
strsim = "0.11"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.13"
rstest = "0.26"
