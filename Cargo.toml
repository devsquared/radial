[workspace]
members = ["radial-core"]
# Without this, a bare `cargo test`/`clippy` (no `--workspace`) only sees the
# root package and silently skips radial-core -- CI passes --workspace
# explicitly too, but this keeps that the same by default.
default-members = [".", "radial-core"]

[package]
name = "radial"
version = "1.0.0"
edition = "2024"
authors = ["Devin Ward <devissquared@gmail.com>"]
description = "Task orchestration for LLM agents with contract-based coordination"
readme = "README.md"
license = "MIT"
repository = "https://github.com/devsquared/radial"
homepage = "https://github.com/devsquared/radial"
documentation = "https://docs.rs/radial"
keywords = ["cli", "tasks", "agents", "llm", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/*", "testing/*", ".radial/*"]

[dependencies]
radial-core = { path = "radial-core", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
jiff = { version = "0.2", features = ["serde"] }
console = "0.15"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std"] }

[dev-dependencies]
tempfile = "3.13"
rstest = "0.26"
toml = "1.0"

[[bin]]
name = "rd"
path = "src/main.rs"
