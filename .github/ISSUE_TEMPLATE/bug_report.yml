name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact `rd` commands you ran, in order.
      placeholder: |
        1. rd init
        2. rd goal create "..."
        3. rd task create ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Radial version
      description: Output of `rd --version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. macOS 15.2, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, `.radial/` state, or anything else relevant.
    validations:
      required: false
